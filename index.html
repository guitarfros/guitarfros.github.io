<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="UTF-8">
<title>StudioFros - Free Plugins</title>
<style>
  body{margin:0; background:#181818; color:#ddd; font-family:system-ui}
  header{border:2px solid #444; margin:20px; padding:12px 20px; display:flex; justify-content:space-between; background:linear-gradient(#2a2a2a,#1e1e1e)}
  .hero{text-align:center; padding:15px}
  .grid{display:grid; grid-template-columns:repeat(5,1fr); gap:20px; padding:20px; max-width:1400px; margin:auto}
  .card{border:2px solid #3a3a3a; background:#1c1c1c; padding:10px; text-align:center}
  .card img{width:100%; height:140px; object-fit:contain; background:#0e0e0e; border:1px solid #333; margin-top:8px}
  .card h3{font-size:12px; margin:10px 0 3px; text-transform:uppercase; letter-spacing:1px}
  .card p{font-size:10px; color:#777; margin:0 0 10px}
  .btns{display:flex; gap:6px; justify-content:center}
  .btn{flex:1; background:linear-gradient(#333,#222); border:1px solid #555; color:#bbb; padding:6px 0; font-size:10px; text-decoration:none; text-align:center; cursor:pointer}
  .btn:hover{background:#444; color:#fff}
</style>
</head>
<body>
<header><div>StudioFros</div><div style="font-size:11px; color:#999; display:flex; gap:20px"><span>PLUGINS</span><span>ABOUT</span><span>SUPPORT</span></div></header>
<div class="hero"><h3 style="letter-spacing:3px; margin:0">FREE AUDIO PLUGINS</h3><p style="color:#888; font-size:12px">10 free plugins — VST3 • AU • CLAP • No account. Just download.</p></div>

<div class="grid">
  <!-- COPIA ESTE BLOQUE PARA CADA PLUGIN, cambia os links -->
  <div class="card">
    <img src="img/vinyl.png">
    <h3>Vinyl</h3>
    <p>Vinyl crackle • v1.2</p>
    <div class="btns">
      <a href="https://github.com/StudioFros/vinyl/releases/download/v1.2/vinyl-win.zip" class="btn">WIN</a>
      <a href="https://github.com/StudioFros/vinyl/releases/download/v1.2/vinyl-mac.zip" class="btn">MAC</a>
      <a href="https://github.com/StudioFros/vinyl/releases/download/v1.2/vinyl-linux.zip" class="btn">LINUX</a>
    </div>
  </div>

  <div class="card">
    <img src="img/tape.png">
    <h3>Tape</h3>
    <p>Tape saturator • v1.3</p>
    <div class="btns">
      <a href="https://github.com/StudioFros/tape/releases/download/v1.3/tape-win.zip" class="btn">WIN</a>
      <a href="https://github.com/StudioFros/tape/releases/download/v1.3/tape-mac.zip" class="btn">MAC</a>
      <a href="https://github.com/StudioFros/tape/releases/download/v1.3/tape-linux.zip" class="btn">LINUX</a>
    </div>
  </div>

  <!-- Repite ata 10, só cambia nome e link -->
</div>
</body>
</html>
