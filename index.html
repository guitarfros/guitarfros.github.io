<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuitarFros · Apps e plugins VST3</title>
  <meta name="description" content="Apps para guitarristas e plugins VST3 para guitarra e estudio de GuitarFros, Doctor Migrana e StudioFros.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="layout">

    <header class="plate hero">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <img class="hero-logo" src="assets/logo.png" alt="Logo de GuitarFros App" width="220" height="220">
      <h1>GuitarFros</h1>
      <p>Apps para guitarristas e plugins VST3 para guitarra e estudio. Elixe un grupo, xira o carrusel e descarga o que che sirva.</p>
      <a class="mail" href="mailto:guitarfros@gmail.com">guitarfros@gmail.com</a>
    </header>

    <div class="content">
      <nav class="plate selector" aria-label="Grupos" id="groups"></nav>

      <main>
        <section class="stage" aria-roledescription="carrusel" aria-label="Catálogo">
          <button class="arrow prev" id="prev" aria-label="Anterior"><span></span></button>
          <div class="track" id="track" tabindex="0" aria-live="polite"></div>
          <button class="arrow next" id="next" aria-label="Seguinte"><span></span></button>
        </section>

        <div class="dots" id="dots" role="tablist" aria-label="Elementos do grupo"></div>

        <article class="plate detail" id="detail">
          <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
          <p class="brand" id="d-brand"></p>
          <h2 id="d-name"></h2>
          <p class="tag" id="d-tag"></p>
          <p class="desc" id="d-desc"></p>
          <div class="downloads" id="d-downloads"></div>
        </article>
      </main>
    </div>

  </div>

  <footer>
    <p>© GuitarFros · Feito con rock and roll · <a href="mailto:guitarfros@gmail.com">guitarfros@gmail.com</a></p>
  </footer>

  <script src="plugins.js"></script>
  <script src="app.js"></script>
</body>
</html>
