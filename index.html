<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuitarFros · Apps e plugins VST3</title>
  <!-- Mentres a web estea en construción non queremos que a indexen os buscadores. BORRA esta liña ao lanzala. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Apps para guitarristas e plugins VST3 para guitarra e estudio de GuitarFros, Doctor Migrana e StudioFros.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wip" id="wip" role="status" hidden>
    <span class="wip-title" data-i18n="wip.title"></span>
    <span class="wip-text" data-i18n="wip.text"></span>
  </div>

  <div class="layout">

    <header class="plate hero">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <img class="hero-logo" src="assets/logo-engraved.png" alt="Logo de GuitarFros App" data-i18n-alt="logoAlt">
      <h1>GuitarFros</h1>
      <p data-i18n="hero.text"></p>
      <div class="lang" role="group" data-i18n-aria="lang.label" aria-label="Idioma">
        <button class="switch mini" type="button" data-lang="gl" aria-pressed="false"><i class="led"></i><span>Galego</span></button>
        <button class="switch mini" type="button" data-lang="es" aria-pressed="false"><i class="led"></i><span>Español</span></button>
        <button class="switch mini" type="button" data-lang="en" aria-pressed="false"><i class="led"></i><span>English</span></button>
      </div>
      <p class="hero-foot"><span data-i18n="footer"></span> · <a href="mailto:guitarfros@gmail.com">guitarfros@gmail.com</a></p>
    </header>

    <div class="content">
      <nav class="plate selector" data-i18n-aria="nav.groups" aria-label="Grupos" id="groups"></nav>

      <main>
        <section class="stage" aria-roledescription="carrusel" data-i18n-aria="stage.label" aria-label="Catálogo">
          <button class="arrow prev" id="prev" data-i18n-aria="prev" aria-label="Anterior"><span></span></button>
          <div class="track" id="track" tabindex="0" aria-live="polite"></div>
          <button class="arrow next" id="next" data-i18n-aria="next" aria-label="Seguinte"><span></span></button>
        </section>

        <div class="dots" id="dots" role="tablist" data-i18n-aria="dots" aria-label="Elementos do grupo"></div>

        <article class="plate detail" id="detail">
          <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
          <p class="brand" id="d-brand"></p>
          <h2 id="d-name"></h2>
          <p class="tag" id="d-tag"></p>
          <p class="desc" id="d-desc"></p>
          <div class="downloads" id="d-downloads"></div>
        </article>
      </main>

    </div>

  </div>


  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
    <div class="lb-frame plate">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <button class="lb-close" id="lb-close" type="button" data-i18n-aria="close" aria-label="Pechar"><span></span></button>
      <div class="lb-media" id="lb-media"></div>
      <p class="lb-cap" id="lb-cap"></p>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="plugins.js"></script>
  <script src="app.js"></script>
</body>
</html>
